# Netlify build config for the Astro marketing site. With this in the repo,
# "New site from Git" needs no manual build settings.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Redirects live in public/_redirects (app-only paths -> app.hotelgrader.com).
# PUBLIC_HG_API and PUBLIC_HG_APP are set in the Netlify UI, not here, so the
# repo carries no environment-specific values.
